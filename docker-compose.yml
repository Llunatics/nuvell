version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nuvelll-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nuvelll
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nuvelll-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuvelll-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/nuvelll?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      ADMIN_SECRET: "nuvelll_admin_secret_key_2026"
      CRAWLER_USER_AGENT: "nuvelll-bot/1.0 (+https://nuvelll.id/crawler-policy)"
      NODE_ENV: "production"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuvelll-worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/nuvelll?schema=public"
      REDIS_URL: "redis://redis:6379"
      ADMIN_SECRET: "nuvelll_admin_secret_key_2026"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nuvelll-scheduler
    restart: unless-stopped
    command: ["npm", "run", "scheduler"]
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/nuvelll?schema=public"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
